version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore:"
    groups:
      bun-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: weekly
      day: tuesday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore:"
    groups:
      cargo-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: wednesday
      time: "06:00"
      timezone: Europe/Helsinki
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci:"
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: [minor, patch]
