version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: Europe/Prague
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore:"
    groups:
      bun-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: cargo
    directory: /src-tauri
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: Europe/Prague
    open-pull-requests-limit: 3
    commit-message:
      prefix: "chore:"
    groups:
      cargo-updates:
        patterns: ["*"]
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: cron
      cronjob: "0 0 * * *"
      timezone: Europe/Prague
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci:"
    groups:
      actions-updates:
        patterns: ["*"]
        update-types: [minor, patch]
