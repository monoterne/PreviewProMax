name: "ci: desktop builds"
run-name: "ci: desktop builds"

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  package:
    name: "ci: package ${{ matrix.target }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: mac-legacy
            bundles: app
            browser: webkit
            require_pinch: false
            config_args: --config src-tauri/tauri.macos.legacy.conf.json
          - os: macos-latest
            target: mac-adaptive
            bundles: app
            browser: webkit
            require_pinch: true
            config_args: --config src-tauri/tauri.macos.conf.json
          - os: ubuntu-24.04
            target: linux
            bundles: deb,rpm
            browser: webkit
          - os: windows-latest
            target: win
            bundles: nsis
            browser: chromium
            require_pinch: false
            config_args: ""
    runs-on: ${{ matrix.os }}
    env:
      PREVIEW_PRO_MAX_REQUIRE_PINCH: ${{ matrix.require_pinch }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev desktop-file-utils xdotool xvfb
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bunx playwright install ${{ runner.os == 'Linux' && '--with-deps' || '' }} ${{ matrix.browser }}
      - run: bun run test:ui --project=${{ matrix.browser }}
      - name: Check native macOS webview
        if: runner.os == 'macOS'
        run: bun run test:native
      - run: bun tauri build ${{ matrix.config_args }} --bundles ${{ matrix.bundles }}
      - name: Upload Fedora package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pro-max-linux-fedora
          path: src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
      - name: Check macOS bundle icon
        if: runner.os == 'macOS'
        shell: bash
        run: |
          app="src-tauri/target/release/bundle/macos/Preview Pro Max.app"
          test -s "$app/Contents/Resources/icon.icns"
          if [[ "${{ matrix.target }}" == mac-adaptive ]]; then
            test -s "$app/Contents/Resources/Assets.car"
            test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIconName' "$app/Contents/Info.plist")" = PreviewProMax
          fi
      - name: Prepare desktop smoke test fixture
        if: runner.os != 'macOS'
        shell: bash
        run: |
          bun -e 'import { fixture } from "./tests/fixtures/pdf"; await Bun.write(process.argv[1], new Uint8Array(fixture()))' "$RUNNER_TEMP/preview-fixture.pdf"
      - name: Open a PDF in the portable Windows app
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $fixture = Join-Path $env:RUNNER_TEMP 'preview-fixture.pdf'
          $session = Join-Path $env:APPDATA 'com.previewpromax.viewer/sessions.json'
          $app = Start-Process './src-tauri/target/release/preview-pro-max.exe' -ArgumentList ('"{0}"' -f $fixture) -PassThru
          try {
            $deadline = [DateTime]::UtcNow.AddSeconds(60)
            do {
              $app.Refresh()
              if ($app.HasExited) { throw "Viewer exited with code $($app.ExitCode)" }
              if ($app.MainWindowHandle -ne [IntPtr]::Zero -and (Test-Path $session)) {
                $saved = Get-Content -Raw $session | ConvertFrom-Json
                if ($saved.windows.tabs.path -contains $fixture) { return }
              }
              Start-Sleep -Milliseconds 250
            } while ([DateTime]::UtcNow -lt $deadline)
            throw "Timed out opening $fixture in the portable viewer"
          } finally {
            if (!$app.HasExited) { Stop-Process -Id $app.Id -Force }
          }
      - name: Test installed Ubuntu package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          dbus-run-session -- xvfb-run -a bash tests/native/linux.sh "$RUNNER_TEMP/preview-fixture.pdf"
      - name: Prepare downloads
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Preview Pro Max.app" "artifacts/PreviewProMax-${{ matrix.target }}.app.zip"
          elif [ "${{ runner.os }}" = "Linux" ]; then
            cp src-tauri/target/release/bundle/deb/*.deb artifacts/
          else
            cp src-tauri/target/release/preview-pro-max.exe artifacts/PreviewProMax-portable.exe
            cp src-tauri/target/release/bundle/nsis/*.exe artifacts/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: preview-pro-max-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
      - name: Test installed Fedora package
        if: runner.os == 'Linux'
        run: |
          docker run --rm \
            --mount "type=bind,src=$PWD/src-tauri/target/release/bundle/rpm,dst=/packages,readonly" \
            --mount "type=bind,src=$PWD/tests/native/linux.sh,dst=/smoke-test.sh,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP/preview-fixture.pdf,dst=/fixture.pdf,readonly" \
            registry.fedoraproject.org/fedora:44 bash -euo pipefail -c '
              dnf install -y /packages/*.rpm dbus-daemon desktop-file-utils jq xdotool xorg-x11-server-Xvfb mesa-dri-drivers google-noto-sans-vf-fonts
              # Docker restricts the namespaces used by the WebKit sandbox.
              WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 dbus-run-session -- xvfb-run -a bash /smoke-test.sh /fixture.pdf
            '
      - name: Save compiled icon catalog
        if: matrix.target == 'mac-adaptive'
        uses: actions/upload-artifact@v7
        with:
          name: preview-pro-max-icon-catalog-adaptive
          path: |
            src-tauri/icons/Assets.car
            src-tauri/icons/catalog.json
          if-no-files-found: error
