name: Build desktop apps

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: mac
            bundles: app
            browser: webkit
          - os: windows-latest
            target: win
            bundles: nsis
            browser: chromium
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2.2.0
      - uses: dtolnay/rust-toolchain@stable
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bunx playwright install ${{ matrix.browser }}
      - run: bun run test:ui --project=${{ matrix.browser }}
      - run: bun tauri build --bundles ${{ matrix.bundles }}
      - name: Prepare downloads
        shell: bash
        run: |
          mkdir -p artifacts
          if [ "${{ runner.os }}" = "macOS" ]; then
            ditto -c -k --sequesterRsrc --keepParent "src-tauri/target/release/bundle/macos/Preview Pro Max.app" "artifacts/PreviewProMax-mac.app.zip"
          else
            cp src-tauri/target/release/preview-pro-max.exe artifacts/PreviewProMax-portable.exe
            cp src-tauri/target/release/bundle/nsis/*.exe artifacts/
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: preview-pro-max-${{ matrix.target }}
          path: artifacts/*
          if-no-files-found: error
