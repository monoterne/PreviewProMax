[package]
name = "preview-pro-max"
version = "0.3.2"
description = "Desktop PDF viewer for Linux, macOS and Windows"
repository = "https://github.com/monoterne/PreviewProMax"
edition = "2024"
rust-version = "1.90"

[lib]
name = "preview_pro_max_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(target_os = "macos")'.dependencies]
block2 = "0.6"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSEvent", "NSMenu", "NSResponder", "NSScreen", "NSWindow", "block2", "objc2-core-graphics"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["CGEvent", "CGEventTypes"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["NSGeometry", "NSString"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
incremental = false
