[package]
name = "preview-pro-max"
version = "0.1.0"
description = "Desktop PDF viewer for macOS and Windows"
repository = "https://github.com/monoterne/PreviewProMax"
edition = "2024"
rust-version = "1.90"

[lib]
name = "preview_pro_max_lib"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true
incremental = false
